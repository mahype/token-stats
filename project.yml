name: TokenStats
options:
  bundleIdPrefix: de.mahype
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
  # Gemeinsamer Kern von App und Widget-Erweiterung (Modell, Formate, Widget-Views).
  TokenStatsCore:
    path: Packages/TokenStatsCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.3.2"
    # App Group für die Widgets (Issue #10), mit Team-ID-Präfix: macOS lässt nur Apps desselben
    # Teams an den Container, und `group.`-Kennungen verlangen ein Provisioning-Profil. Darum folgt
    # die Kennung der Signatur: Sven → 2GA7DQ3P3Z.…, ein Debug-Build mit eigenem Zertifikat →
    # eigene Team-ID. App und Erweiterung lesen sie aus ihrer Info.plist (TokenStatsAppGroup).
    APP_GROUP: "$(DEVELOPMENT_TEAM).de.mahype.TokenStats"
    # Sparkle vergleicht CFBundleVersion mit dem Appcast – darum identisch mit der Version.
    CURRENT_PROJECT_VERSION: "$(MARKETING_VERSION)"

targets:
  TokenStats:
    type: application
    platform: macOS
    sources:
      - path: Sources/TokenStats
    dependencies:
      - package: Sparkle
      - package: TokenStatsCore
      - target: TokenStatsWidgets
    # Die App bleibt ohne Sandbox, weil sie Schlüsselbund und ~/.claude, ~/.codex lesen muss.
    # XcodeGen schreibt die Entitlements-Datei bei jedem Lauf neu, darum steht der Inhalt hier.
    entitlements:
      path: Config/TokenStats.entitlements
      properties:
        com.apple.security.application-groups: ["$(APP_GROUP)"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.mahype.TokenStats
        PRODUCT_NAME: Token Stats
        PRODUCT_MODULE_NAME: TokenStats
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Token Stats
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_APP_SANDBOX: NO

  # WidgetKit-Erweiterung (Issue #10): immer sandboxed, liest nur widgets.json aus der App Group.
  TokenStatsWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/TokenStatsWidgets
    dependencies:
      - package: TokenStatsCore
    entitlements:
      path: Config/TokenStatsWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: ["$(APP_GROUP)"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.mahype.TokenStats.Widgets
        PRODUCT_NAME: TokenStatsWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Widgets-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Token Stats
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES

  TokenStatsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/TokenStatsTests
    dependencies:
      - target: TokenStats
      - package: TokenStatsCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Token Stats.app/Contents/MacOS/Token Stats"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  TokenStats:
    build:
      targets:
        TokenStats: all
        TokenStatsTests: [test]
    test:
      targets:
        - TokenStatsTests
